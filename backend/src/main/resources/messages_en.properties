error.INVALID_REQUEST.title=Invalid request
error.INVALID_REQUEST.detail=The request is not valid.
error.METHOD_NOT_ALLOWED.title=Method not allowed
error.METHOD_NOT_ALLOWED.detail=Method not allowed.
error.NOT_ACCEPTABLE.title=Not acceptable
error.NOT_ACCEPTABLE.detail=Response format not available.
error.UNSUPPORTED_MEDIA_TYPE.title=Unsupported media type
error.UNSUPPORTED_MEDIA_TYPE.detail=Content type not supported.
error.NOT_FOUND.title=Not found
error.NOT_FOUND.detail=Resource not found.
error.INTERNAL_ERROR.title=Internal error
error.INTERNAL_ERROR.detail=Internal error.
error.INVALID_PIN.title=Invalid PIN
error.INVALID_PIN.detail=The PIN must be exactly 8 digits and cannot be a sequence, a repeated pattern or a date.
