# English texts for API errors (UTF-8, no BOM). Same keys as messages_es.properties.
# These messages take no arguments; if one is ever added, MessageFormat rules apply (double any apostrophe).
error.INVALID_CREDENTIALS.title=Invalid credentials
error.INVALID_CREDENTIALS.detail=Company, code or PIN is incorrect. If it failed several times, wait 15 minutes or contact your administrator.
error.TOO_MANY_ATTEMPTS.title=Too many attempts
error.TOO_MANY_ATTEMPTS.detail=Too many attempts. Try again in a few minutes.
error.INVALID_REQUEST.title=Invalid request
error.INVALID_REQUEST.detail=The request is not valid.
error.METHOD_NOT_ALLOWED.title=Method not allowed
error.METHOD_NOT_ALLOWED.detail=Method not allowed.
error.NOT_ACCEPTABLE.title=Not acceptable
error.NOT_ACCEPTABLE.detail=Response format not available.
error.UNSUPPORTED_MEDIA_TYPE.title=Unsupported media type
error.UNSUPPORTED_MEDIA_TYPE.detail=Content type not supported.
error.NOT_FOUND.title=Not found
error.NOT_FOUND.detail=Resource not found.
error.INTERNAL_ERROR.title=Internal error
error.INTERNAL_ERROR.detail=Internal error.
error.INVALID_PIN.title=Invalid PIN
error.INVALID_PIN.detail=The PIN must be exactly 8 digits and cannot be a sequence, a repeated pattern or a date.
error.CONSENT_REQUIRED.title=Consent required
error.CONSENT_REQUIRED.detail=You must accept the photo and location notice before clocking in.
error.NO_BRANCH_ASSIGNED.title=No branch assigned
error.NO_BRANCH_ASSIGNED.detail=Your user has no branch assigned, so it cannot clock in. Contact your administrator.
error.ALREADY_CLOCKED_IN.title=Already clocked in
error.ALREADY_CLOCKED_IN.detail=You already clocked in. The next step is to clock out.
error.NOT_CLOCKED_IN.title=No clock-in found
error.NOT_CLOCKED_IN.detail=You cannot clock out without clocking in first.
error.SHIFT_ALREADY_COMPLETED.title=Day already complete
error.SHIFT_ALREADY_COMPLETED.detail=You already clocked in and out today.
error.CLIENT_UUID_CONFLICT.title=Duplicate request ID
error.CLIENT_UUID_CONFLICT.detail=This request ID was already used for a different time entry. Try again.
error.PHOTO_REQUIRED.title=Photo required
error.PHOTO_REQUIRED.detail=A selfie is required to clock in or out.
error.INVALID_PHOTO.title=Invalid photo
error.INVALID_PHOTO.detail=The photo must be a JPEG or PNG image.
error.PAYLOAD_TOO_LARGE.title=File too large
error.PAYLOAD_TOO_LARGE.detail=The photo is larger than the allowed size.
error.SERVER_BUSY.title=Server busy
error.SERVER_BUSY.detail=The server is busy. Try again in a few seconds.
error.ENTRY_CHANGED.title=Entry changed
error.ENTRY_CHANGED.detail=Someone else changed this entry. Reload and try again.
error.INVALID_STATUS_CHANGE.title=Change not allowed
error.INVALID_STATUS_CHANGE.detail=This entry is already in that state or cannot change that way.
error.ENTRY_ALREADY_EXISTS.title=Entry already exists
error.ENTRY_ALREADY_EXISTS.detail=This employee already has that entry for the selected day.
error.CLOCK_IN_REQUIRED.title=Clock-in required
error.CLOCK_IN_REQUIRED.detail=Register the clock-in for that day before the clock-out.
error.INVALID_ENTRY_TIME.title=Invalid time
error.INVALID_ENTRY_TIME.detail=The time is in the future, outside the work day or not after the clock-in.
error.EMPLOYEE_CODE_TAKEN.title=Code in use
error.EMPLOYEE_CODE_TAKEN.detail=Another employee of this company already uses that code.
error.BRANCH_NAME_TAKEN.title=Name in use
error.BRANCH_NAME_TAKEN.detail=Another branch already has that name.
error.BRANCH_REQUIRED.title=Branch required
error.BRANCH_REQUIRED.detail=Employees must have a branch.
error.BRANCH_INACTIVE.title=Inactive branch
error.BRANCH_INACTIVE.detail=The selected branch is inactive.
error.BRANCH_IN_USE.title=Branch in use
error.BRANCH_IN_USE.detail=Move or deactivate its employees before deactivating the branch.
error.LAST_ADMIN.title=Last administrator
error.LAST_ADMIN.detail=The company must keep at least one active administrator.
error.SELF_CHANGE_NOT_ALLOWED.title=Not allowed on yourself
error.SELF_CHANGE_NOT_ALLOWED.detail=You cannot deactivate yourself or remove your own administrator role.
error.DATE_RANGE_TOO_LARGE.title=Range too large
error.DATE_RANGE_TOO_LARGE.detail=Choose a period of at most 62 days, with the start before the end.
error.REPORT_TOO_LARGE.title=Too much data
error.REPORT_TOO_LARGE.detail=Narrow the period or choose a branch.
error.RATE_LIMITED.title=Too many actions
error.RATE_LIMITED.detail=Too many actions in a short time. Wait a few minutes and try again.
error.RECORD_CHANGED.title=Record changed
error.RECORD_CHANGED.detail=Someone else changed this record. Reload and try again.
error.ADMIN_PIN_RESET_NOT_ALLOWED.title=PIN reset not allowed
error.ADMIN_PIN_RESET_NOT_ALLOWED.detail=You cannot reset the PIN of another active administrator.
