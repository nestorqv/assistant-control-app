spring:
  application:
    name: asistencia-backend
  # Relative to the working directory (backend/). Real environment variables override it.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistencia}
    username: ${DB_USER:asistencia_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    # Empty default: JwtProperties fails at startup with a clear message instead of a placeholder error.
    secret: ${JWT_SECRET:}
    issuer: asistencia-backend
    ttl-empleado: 8h
    ttl-admin: 6h
    clock-skew: 30s
  security:
    bcrypt-strength: 12
    lockout:
      max-intentos: 5
      duracion: 15m
    login-rate-limit:
      max-intentos: 20
      ventana: 5m

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
