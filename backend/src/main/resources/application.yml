spring:
  application:
    name: attendance-backend
  # Relative to the working directory (backend/). Real environment variables override it.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistencia}
    username: ${DB_USER:asistencia_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    # Empty default: JwtProperties fails at startup with a clear message instead of a placeholder error.
    secret: ${JWT_SECRET:}
    issuer: attendance-backend
    ttl-employee: 8h
    ttl-admin: 6h
    clock-skew: 30s
  security:
    bcrypt-strength: 12
    lockout:
      max-attempts: 5
      duration: 15m
    login-rate-limit:
      max-attempts: 20
      window: 5m

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
