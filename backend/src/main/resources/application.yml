spring:
  application:
    name: attendance-backend
  # Relative to the working directory (backend/). Real environment variables override it.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistencia?logServerErrorDetail=false}
    username: ${DB_USER:asistencia_app}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # PgJDBC puts "Detail: Key (company_id, code)=(...)" (and failing rows) into exceptions and logs by default.
        # Employee codes and names are PII: keep only the constraint name in the message. Applies whatever DB_URL is.
        logServerErrorDetail: "false"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 3MB        # hard ceiling; the app rejects > 2MB first with a localized 413
      max-request-size: 4MB
      file-size-threshold: 256KB
      resolve-lazily: true      # parse only when the handler binds the form (after auth and the rate limit)

app:
  jwt:
    # Empty default: JwtProperties fails at startup with a clear message instead of a placeholder error.
    secret: ${JWT_SECRET:}
    issuer: attendance-backend
    ttl-employee: 8h
    ttl-admin: 6h
    clock-skew: 30s
  security:
    bcrypt-strength: 12
    lockout:
      max-attempts: 5
      duration: 15m
    login-rate-limit:
      max-attempts: 20
      window: 5m
  storage:
    root: ${UPLOADS_DIR:uploads}   # relative to backend/; outside the web root
    max-photo-bytes: 2MB
    max-input-dimension: 2560   # the PWA sends ~1024 px; larger is refused from the header
    max-input-pixels: 6000000
    output-max-dimension: 1280
    jpeg-quality: 0.85
    max-concurrent-decodes: 3   # process-wide; more simultaneous uploads wait, then get 503 SERVER_BUSY
    decode-acquire-timeout: 2s
    # temp-dir: defaults to <root>/.upload-tmp (multipart spool, private, emptied at start)
  time-entry:
    max-shift-duration: 16h
    clock-skew-tolerance: 2m
    lock-timeout: 5s            # how long a POST waits for the employee row lock (PostgreSQL lock_timeout)
    max-gps-accuracy-meters: 100
    after-schedule-tolerance: 60m   # clock-out later than the scheduled end + this goes to review
    rate-limit:
      max-attempts: 30
      window: 10m

  admin:
    max-dashboard-rows: 1000
    # The longest shift an admin may enter or correct is app.time-entry.max-shift-duration (16h), as in the PWA.
    rate-limit:                  # per admin
      photo: {max-attempts: 300, window: 10m}
      export: {max-attempts: 10, window: 10m}
      account: {max-attempts: 30, window: 10m}
      write: {max-attempts: 120, window: 10m}         # every admin POST/PUT/PATCH/DELETE except the review budget
      review-write: {max-attempts: 300, window: 10m}  # approve / reject / correct / admin-created entries
      detail: {max-attempts: 300, window: 10m}        # entry detail (carries GPS)

logging:
  level:
    # Logs SQL errors with the driver message before the facades map them; the facades and the exception
    # handler log what is needed (constraint name and class only).
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

server:
  port: 8080
  tomcat:
    max-part-count: 10          # Boot default is 50; the form has 7 parts
    max-swallow-size: 5MB       # > max-request-size so oversize gets a readable 413, not a reset
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
